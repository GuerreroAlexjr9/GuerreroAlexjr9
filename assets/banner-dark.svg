<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-label="Alex Guerrero — Frontend/Mobile Architect">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F2937" stroke-width="0.5" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <!-- accent bar -->
  <rect x="80" y="92" width="4" height="136" fill="url(#accent)" rx="2"/>

  <!-- eyebrow -->
  <text x="104" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" fill="#94A3B8" letter-spacing="2">
    FRONTEND · MOBILE · ARCHITECTURE
  </text>

  <!-- headline -->
  <text x="104" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="44" font-weight="700" fill="#F8FAFC">
    Alex Guerrero
  </text>

  <!-- subline -->
  <text x="104" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="20" fill="#CBD5E1">
    React · React Native · TypeScript · Enterprise Architecture
  </text>

  <!-- micro tag -->
  <g transform="translate(104, 232)">
    <rect width="12" height="12" rx="6" fill="#22C55E"/>
    <circle cx="6" cy="6" r="6" fill="#22C55E" opacity="0.35"/>
    <text x="22" y="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13" fill="#94A3B8">
      Available for consulting · Santa Marta, CO · UTC−5
    </text>
  </g>

  <!-- right side: code-like tags -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" opacity="0.85">
    <text x="900" y="120" fill="#64748B">// scope</text>
    <text x="900" y="144" fill="#94A3B8">architecture<tspan fill="#64748B">:</tspan> <tspan fill="#38BDF8">"feature-based"</tspan></text>
    <text x="900" y="168" fill="#94A3B8">testing<tspan fill="#64748B">:</tspan> <tspan fill="#38BDF8">"first-class"</tspan></text>
    <text x="900" y="192" fill="#94A3B8">migrations<tspan fill="#64748B">:</tspan> <tspan fill="#38BDF8">"incremental"</tspan></text>
    <text x="900" y="216" fill="#94A3B8">design_system<tspan fill="#64748B">:</tspan> <tspan fill="#38BDF8">"composable"</tspan></text>
    <text x="900" y="240" fill="#94A3B8">delivery<tspan fill="#64748B">:</tspan> <tspan fill="#38BDF8">"enterprise"</tspan></text>
  </g>
</svg>
